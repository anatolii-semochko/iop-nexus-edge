name: nexus-edge

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-edge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nexus-edge-network

  redis:
    image: redis:7-alpine
    container_name: nexus-edge-redis
    restart: unless-stopped
    ports:
      # Distinct from REDIS_PORT (redis's own container-internal listen
      # port, always 6379, used internally by api/orchestrator) - same
      # separation POSTGRES_PORT/POSTGRES_HOST_PORT already have below.
      # Host-side debug port only; reusing REDIS_PORT for both broke
      # nexus-edge-smart-house's EdgeX connection the same way
      # (AGENTS_TO_DO.md 2026-07-28).
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"
    volumes:
      - redis-data:/data
    networks:
      - nexus-edge-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: nexus-edge-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      # Distinct from RABBITMQ_PORT (internal AMQP connection port for
      # api/orchestrator/messaging-gateway, always 5672) - same reasoning
      # as REDIS_HOST_PORT above.
      - "127.0.0.1:${RABBITMQ_HOST_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - nexus-edge-network

  orchestrator:
    build:
      context: .
      dockerfile: apps/orchestrator/Dockerfile
    container_name: nexus-edge-orchestrator
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "${ORCHESTRATOR_PORT}:${ORCHESTRATOR_PORT}"
    networks:
      - nexus-edge-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexus-edge-api
    restart: unless-stopped
    # Service->Commands (AGENTS_TO_DO.md, 2026-08-30) - Docker's own
    # default AppArmor profile ("docker-default") blocks a container from
    # sending ANY D-Bus method call, even a harmless read-only query,
    # regardless of the /run/dbus/system_bus_socket mount below (confirmed
    # live via dmesg: apparmor="DENIED" operation="dbus_method_call"
    # label="docker-default"). Same tradeoff Home Assistant's own
    # Supervisor container accepts for the identical reason - this
    # container loses AppArmor confinement entirely, not just for D-Bus.
    security_opt:
      - apparmor:unconfined
    env_file: .env
    # Live-debugged 2026-08-14 (process management's registered-kinds
    # proxy, routes/processes.ts): Node's default libuv threadpool (4
    # threads) handles far more than just fs - DNS lookups (getaddrinfo,
    # what `fetch('http://orchestrator:...')` needs) queue on it too. Under
    # apps/orchestrator's own steady per-second tick traffic hitting this
    # service, that queue was deep enough to make an otherwise-instant
    # cross-container hostname lookup take 5+ seconds (reproduced live: a
    # bare `node -e` fetch to the same URL from the same container
    # resolved in ~50ms every time, but the identical fetch from inside a
    # real request handler here consistently timed out - the difference
    # was purely how busy this process's threadpool already was). Not
    # unique to the registered-kinds route - any outbound fetch-by-
    # hostname from this service under load would have hit the same
    # queueing, this just happened to be the first one added.
    environment:
      UV_THREADPOOL_SIZE: "64"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - api-avatars:${AVATAR_UPLOAD_DIR}
      # Service->Commands (AGENTS_TO_DO.md, 2026-08-30) - lets systemCommands.ts
      # call org.freedesktop.login1 (systemd-logind) on the HOST bus to
      # power off/reboot the actual machine this stack runs on. Harmless
      # to mount even with SHUTDOWN_ENABLE/RESTART_ENABLE both false (the
      # route stays 403'd) - only omit this on a host with no D-Bus system
      # bus (rare; the mount then just fails to appear and the route's own
      # connect-time check reports the commands unavailable).
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    networks:
      - nexus-edge-network

  messaging-gateway:
    build:
      context: .
      dockerfile: apps/messaging-gateway/Dockerfile
    container_name: nexus-edge-messaging-gateway
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - rabbitmq
    ports:
      - "${MESSAGING_GATEWAY_PORT}:${MESSAGING_GATEWAY_PORT}"
    networks:
      - nexus-edge-network

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    container_name: nexus-edge-ui
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
      - messaging-gateway
    ports:
      - "${UI_PORT}:80"
    networks:
      - nexus-edge-network

networks:
  nexus-edge-network: {}

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  api-avatars:
