# Source of truth for this device type's EdgeX-facing shape. The copy
# actually loaded by apps/device-service lives at
# apps/device-service/res/profiles/NexusEdge-LightRegulator.yaml - there is
# no provisioning flow yet that reads this file directly (AGENTS.md section
# 7), so the two must be kept in sync by hand. Identical content.
apiVersion: "v2"
name: "NexusEdge-LightRegulator"
manufacturer: "NexusEdge"
model: "light-regulator-01"
labels:
  - "sensor"
  - "standalone"
description: "Universal 0-100 linear regulator (virtual light dimmer dial)"

deviceResources:
  - name: "Level"
    isHidden: false
    description: "Current position of the physical linear regulator (0-100)"
    properties:
      valueType: "Int32"
      # RW at the EdgeX/core-command level even though this is a read-only
      # sensor from the platform's perspective - the Devices API is what
      # actually enforces "no ordinary command surface for this device"
      # (capabilities.readOnly: true, apps/api/src/routes/devices.ts). An
      # EdgeX-level "R" would make it impossible for the Dev Simulator's
      # .../simulate endpoint to ever push a new reading through
      # core-command at all (EdgeX itself rejects writes to "R" resources
      # with a 405 - see the note on the old bundled
      # NexusEdge-Example-Virtual profile's Temperature deviceResource,
      # which hit exactly this, before the 2026-07-28 Device/Node
      # correction split it out - AGENTS.md section 30).
      readWrite: "RW"
      minimum: 0
      maximum: 100
      defaultValue: "50"

deviceCommands: []
