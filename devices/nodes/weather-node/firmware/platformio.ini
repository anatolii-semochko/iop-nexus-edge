; PlatformIO project for the "weather-node" outdoor station
; (Node Weather Control.txt, AGENTS_TO_DO.md 2026-08-23) - STM32F103C8T6
; ("Blue Pill"), Arduino framework (STM32duino), same toolchain choice as
; `../../control-node/firmware/` and for the same reasons - see that
; project's own platformio.ini comment. See ./README.md before
; building/flashing.

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

lib_deps =
    pazi88/STM32_CAN@^1.1.0
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1

; Same HAL flag control-node's own platformio.ini needed - without it,
; STM32_CAN.cpp's CAN_HandleTypeDef/CAN_BS2_*/HAL_CAN_* symbols are
; undeclared (see that file's own comment for the full explanation).
build_flags =
    -D HAL_CAN_MODULE_ENABLED

upload_protocol = stlink

monitor_speed = 115200
