; PlatformIO project for the "control-node" watchdog board
; (AGENTS_TO_DO.md, 2026-08-09) - STM32F103C8T6 ("Blue Pill"), Arduino
; framework (STM32duino) rather than raw CMSIS/HAL, both because the
; board itself is sold as "Arduino IDE compatible" and because it lets
; this firmware use well-established libraries (STM32_CAN, OneWire/
; DallasTemperature) instead of hand-rolled register-level drivers for
; timing-sensitive protocols this project can't yet verify against real
; hardware. See ./README.md before building/flashing.

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino

lib_deps =
    pazi88/STM32_CAN@^1.1.0
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.7

; ST-Link is the standard flashing tool for this board - swap to
; "serial" here (and put the board's BOOT0 jumper in bootloader mode) if
; using a USB-to-serial adapter and the built-in UART bootloader instead.
upload_protocol = stlink

monitor_speed = 115200
