# Smoke-test / demo profile only - not a "real" device type built for a
# target project. Split out of the old bundled NexusEdge-Example-Virtual
# profile (Switch/Temperature/Heater/Cooler forced into one EdgeX device)
# into one atomic Device per physical part - see to-do.txt's 2026-07-27
# Device/Node refactor. Exercises the Virtual Node Runtime end-to-end,
# same as before.
apiVersion: "v2"
name: "NexusEdge-Example-Temperature"
manufacturer: "NexusEdge"
model: "example-virtual-01"
labels:
  - "example"
description: "Example simulated temperature sensor"

deviceResources:
  - name: "Temperature"
    isHidden: false
    description: "Example simulated sensor reading"
    properties:
      valueType: "Float32"
      # RW at the EdgeX/core-command level even though this is conceptually
      # a read-only sensor - Devices API is what actually enforces "no
      # ordinary command surface for this resource" (capabilities
      # readOnly: true, apps/api/src/routes/devices.ts). Marking it "R"
      # here would make it impossible for the Dev Simulator's .../simulate
      # endpoint to ever push a new reading through core-command at all -
      # EdgeX itself rejects writes to "R" resources outright (405).
      readWrite: "RW"
      units: "C"

deviceCommands: []
