# Real device type, first one provisioned under devices/ (AGENTS.md section
# 7) - source of truth is devices/standalone/actuator/light-regulator/edgex-device-
# profile.yaml, kept identical here by hand (no automated provisioning flow
# yet - see that folder's docs/README.md).
apiVersion: "v2"
name: "NexusEdge-LightRegulator"
manufacturer: "NexusEdge"
model: "light-regulator-01"
labels:
  - "sensor"
  - "standalone"
description: "Universal 0-100 linear regulator (virtual light dimmer dial)"

deviceResources:
  - name: "Level"
    isHidden: false
    description: "Current position of the physical linear regulator (0-100)"
    properties:
      valueType: "Int32"
      # RW at the EdgeX/core-command level even though this is a read-only
      # sensor from the platform's perspective - see the identical note in
      # devices/standalone/actuator/light-regulator/edgex-device-profile.yaml.
      readWrite: "RW"
      minimum: 0
      maximum: 100
      defaultValue: "50"

deviceCommands: []
