# Smoke-test / template profile only - not a real device type. Real device
# types belong under devices/nodes/<node-type>/devices/<device-type>/ once
# they exist (see AGENTS.md section 7); this profile exists purely to prove
# the physical/virtual switch and the Virtual Node Runtime end-to-end before
# any concrete device type is defined. Heater/Cooler additionally exercise
# the Devices API's Model State Validator (apps/api/src/validator.ts),
# which forbids both being active at once - see migration
# ...003_add-example-device-interlock.
apiVersion: "v2"
name: "NexusEdge-Example-Virtual"
manufacturer: "NexusEdge"
model: "example-virtual-01"
labels:
  - "example"
description: "Example virtual device exercising the Virtual Node Runtime"

deviceResources:
  - name: "Switch"
    isHidden: false
    description: "Example actuated boolean state"
    properties:
      valueType: "Bool"
      readWrite: "RW"
      defaultValue: "false"
  - name: "Temperature"
    isHidden: false
    description: "Example simulated sensor reading"
    properties:
      valueType: "Float32"
      # RW at the EdgeX/core-command level even though this is conceptually
      # a read-only sensor - Devices API is what actually enforces "no
      # ordinary command surface for this resource" (capabilities.resources
      # readOnly: true, apps/api/src/routes/devices.ts). Marking it "R" here
      # would make it impossible for the Dev Simulator's .../simulate
      # endpoint to ever push a new reading through core-command at all -
      # EdgeX itself rejects writes to "R" resources outright (405).
      readWrite: "RW"
      units: "C"
  - name: "Heater"
    isHidden: false
    description: "Example actuator - must never be on at the same time as Cooler"
    properties:
      valueType: "Bool"
      readWrite: "RW"
      defaultValue: "false"
  - name: "Cooler"
    isHidden: false
    description: "Example actuator - must never be on at the same time as Heater"
    properties:
      valueType: "Bool"
      readWrite: "RW"
      defaultValue: "false"

deviceCommands: []
