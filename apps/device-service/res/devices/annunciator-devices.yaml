# The Alarm Annunciator node's device instances (devices/nodes/
# alarm-annunciator/, AGENTS_TO_DO.md 2026-08-02) - 16 LEDs (8 red/error, 8
# yellow/warning, one pair per message-group slot) plus its own buzzer
# (reuses the existing NexusEdge-ActiveBuzzer profile - no new profile
# needed for that one).
deviceList:
  - name: "annunciator-error-1"
    profileName: "NexusEdge-Led"
    description: "Alarm Annunciator slot 1 - red/error indicator"
    labels:
      - "indicator"
