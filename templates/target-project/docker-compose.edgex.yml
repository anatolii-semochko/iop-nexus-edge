# EdgeX Foundry stack + device-service for __PROJECT_NAME__ - own
# instance, not shared with nexus-edge's own dev stack or any other
# target project (separate compose project/network, distinct container
# names). Mirrors nexus-edge's own docker-compose.edgex.yml (trimmed
# service set - see that file's header comment for the source
# reference), reused here to keep both in sync by hand rather than
# duplicating design decisions.
#
# Run together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.edgex.yml up
# or: make up-all

name: __SLUG__

services:
  edgex-postgres:
    container_name: __SLUG__-edgex-postgres
    hostname: edgex-postgres
    image: postgres:16.3-alpine
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
    environment:
      POSTGRES_DB: edgex_db
      POSTGRES_PASSWORD: postgres
    volumes:
      - edgex-db-data:/var/lib/postgresql/data
    networks:
      - __SLUG__-network

  edgex-mqtt-broker:
    container_name: __SLUG__-edgex-mqtt-broker
    hostname: edgex-mqtt-broker
    image: eclipse-mosquitto:2.0.22
    command:
      - /usr/sbin/mosquitto
      - -c
      - /mosquitto-no-auth.conf
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    user: "2002:2001"
    networks:
      - __SLUG__-network

  edgex-core-common-config-bootstrapper:
    container_name: __SLUG__-edgex-core-common-config-bootstrapper
    hostname: edgex-core-common-config-bootstrapper
    image: edgexfoundry/core-common-config-bootstrapper:4.0.2
    command:
      - /core-common-config-bootstrapper
      - --registry
      - -cp=keeper.http://edgex-core-keeper:59890
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    user: "2002:2001"
    depends_on:
      edgex-core-keeper:
        condition: service_started
        required: true
    environment:
      ALL_SERVICES_DATABASE_HOST: edgex-postgres
      ALL_SERVICES_MESSAGEBUS_HOST: edgex-mqtt-broker
      ALL_SERVICES_REGISTRY_HOST: edgex-core-keeper
      APP_SERVICES_CLIENTS_CORE_METADATA_HOST: edgex-core-metadata
      DEVICE_SERVICES_CLIENTS_CORE_METADATA_HOST: edgex-core-metadata
      EDGEX_SECURITY_SECRET_STORE: "false"
    networks:
      - __SLUG__-network

  edgex-core-keeper:
    container_name: __SLUG__-edgex-core-keeper
    hostname: edgex-core-keeper
    image: edgexfoundry/core-keeper:4.0.2
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    user: "2002:2001"
    depends_on:
      edgex-postgres:
        condition: service_started
        required: true
    environment:
      DATABASE_HOST: edgex-postgres
      EDGEX_SECURITY_SECRET_STORE: "false"
      MESSAGEBUS_AUTHMODE: none
      MESSAGEBUS_HOST: edgex-mqtt-broker
      MESSAGEBUS_PORT: "1883"
      MESSAGEBUS_PROTOCOL: tcp
      MESSAGEBUS_SECRETNAME: ""
      MESSAGEBUS_TYPE: mqtt
      SERVICE_HOST: edgex-core-keeper
    networks:
      - __SLUG__-network

  edgex-core-metadata:
    container_name: __SLUG__-edgex-core-metadata
    hostname: edgex-core-metadata
    image: edgexfoundry/core-metadata:4.0.2
    command:
      - --registry
      - -cp=keeper.http://edgex-core-keeper:59890
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    user: "2002:2001"
    depends_on:
      edgex-core-keeper:
        condition: service_started
        required: true
      edgex-postgres:
        condition: service_started
        required: true
    environment:
      EDGEX_SECURITY_SECRET_STORE: "false"
      SERVICE_HOST: edgex-core-metadata
    ports:
      # Host-side debug port only, literal env var (NOT
      # EDGEX_CORE_METADATA_PORT - that one is apps/api's internal
      # connection port, always 59881 regardless of this mapping;
      # reusing it here for the host side too was a real bug found
      # nexus-edge-smart-house, 2026-07-28). Give this a project-unique
      # value in .env if running several target projects side by side.
      - "127.0.0.1:${EDGEX_METADATA_HOST_PORT}:59881"
    networks:
      - __SLUG__-network

  edgex-core-data:
    container_name: __SLUG__-edgex-core-data
    hostname: edgex-core-data
    image: edgexfoundry/core-data:4.0.2
    command:
      - --registry
      - -cp=keeper.http://edgex-core-keeper:59890
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    user: "2002:2001"
    depends_on:
      edgex-core-common-config-bootstrapper:
        condition: service_started
        required: true
      edgex-core-keeper:
        condition: service_started
        required: true
      edgex-postgres:
        condition: service_started
        required: true
    environment:
      EDGEX_SECURITY_SECRET_STORE: "false"
      SERVICE_HOST: edgex-core-data
    networks:
      - __SLUG__-network

  edgex-core-command:
    container_name: __SLUG__-edgex-core-command
    hostname: edgex-core-command
    image: edgexfoundry/core-command:4.0.2
    command:
      - --registry
      - -cp=keeper.http://edgex-core-keeper:59890
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    user: "2002:2001"
    depends_on:
      edgex-core-common-config-bootstrapper:
        condition: service_started
        required: true
      edgex-core-keeper:
        condition: service_started
        required: true
      edgex-core-metadata:
        condition: service_started
        required: true
      edgex-postgres:
        condition: service_started
        required: true
    environment:
      EDGEX_SECURITY_SECRET_STORE: "false"
      EXTERNALMQTT_URL: tcp://edgex-mqtt-broker:1883
      SERVICE_HOST: edgex-core-command
    networks:
      - __SLUG__-network

  # nexus-edge's own device-service, reused via build context (not an
  # npm dependency - Go binaries aren't consumed that way). EXTRA_RES_DIR
  # + the volume mount is this project's own private DNPs (extension
  # points design, nexus-edge AGENTS_TO_DO.md 2026-07-28) - merged into
  # res/profiles+res/devices at container start (internal/extrares),
  # alongside nexus-edge's own baked-in Library fixtures. Empty
  # extra-res/ at generation time is fine - a no-op until you add one.
  device-service:
    container_name: __SLUG__-device-service
    build:
      context: ${NEXUS_EDGE_SOURCE_PATH}
      dockerfile: apps/device-service/Dockerfile
    restart: unless-stopped
    depends_on:
      edgex-core-common-config-bootstrapper:
        condition: service_started
        required: true
      edgex-core-keeper:
        condition: service_started
        required: true
      edgex-core-metadata:
        condition: service_started
        required: true
      edgex-core-data:
        condition: service_started
        required: true
      edgex-core-command:
        condition: service_started
        required: true
    environment:
      EDGEX_SECURITY_SECRET_STORE: "false"
      SERVICE_HOST: device-service
      EXTRA_RES_DIR: /extra-res
    volumes:
      - ./extra-res:/extra-res:ro
    networks:
      - __SLUG__-network

networks:
  __SLUG__-network: {}

volumes:
  edgex-db-data:
