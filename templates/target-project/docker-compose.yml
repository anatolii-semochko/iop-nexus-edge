# __PROJECT_NAME__ - a target project built on nexus-edge (Core+Base),
# generated by nexus-edge's `make new-project` (docs/
# CREATING_A_TARGET_PROJECT.md, extension points design). NEXUS_EDGE_
# SOURCE_PATH (.env) points at wherever nexus-edge is checked out - not
# required to be a sibling directory. api/orchestrator/device-service
# reuse nexus-edge's own Dockerfiles directly (build context:
# ${NEXUS_EDGE_SOURCE_PATH}) since they load extensions at runtime
# (env-driven directory scans) - no npm dependency needed. The ui
# service is different: Vite bundles everything at build time, so it
# needs its OWN Dockerfile (apps/ui/Dockerfile) and BuildKit's
# additional_contexts to reach both this project's own plugins/ and
# nexus-edge's source at once, from unrelated paths.
#
# Run together with docker-compose.edgex.yml:
#   docker compose -f docker-compose.yml -f docker-compose.edgex.yml up
# or: make up-all

name: __SLUG__

services:
  postgres:
    image: postgres:16-alpine
    container_name: __SLUG__-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - __SLUG__-network

  redis:
    image: redis:7-alpine
    container_name: __SLUG__-redis
    restart: unless-stopped
    networks:
      - __SLUG__-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: __SLUG__-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - __SLUG__-network

  orchestrator:
    build:
      context: ${NEXUS_EDGE_SOURCE_PATH}
      dockerfile: apps/orchestrator/Dockerfile
    container_name: __SLUG__-orchestrator
    restart: unless-stopped
    env_file: .env
    environment:
      # Extension points (extension points design, nexus-edge AGENTS_TO_DO.md
      # 2026-07-29) - processPlugins.ts scans this for this project's
      # own process kinds (plugins/<name>/process.ts). Empty plugins/ at
      # generation time is fine - a no-op until you add one.
      EXTRA_PROCESS_PLUGINS_DIR: /workspace/plugins
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ./plugins:/workspace/plugins:ro
    ports:
      - "${ORCHESTRATOR_PORT}:${ORCHESTRATOR_PORT}"
    networks:
      - __SLUG__-network

  api:
    build:
      context: ${NEXUS_EDGE_SOURCE_PATH}
      dockerfile: apps/api/Dockerfile
    container_name: __SLUG__-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Extension points (extension points design, nexus-edge AGENTS_TO_DO.md
      # 2026-07-28) - apiPlugins.ts scans this in addition to the
      # Library (devices/, baked into the nexus-edge image).
      EXTRA_API_PLUGINS_DIR: /workspace/plugins
      # Live-debugged 2026-08-14 in nexus-edge's own docker-compose.yml
      # (same comment there, in full) - Node's default libuv threadpool (4
      # threads) queues DNS lookups behind other I/O; under this service's
      # own orchestrator-tick traffic that starved GET /processes/
      # registered-kinds's cross-container fetch to multi-second timeouts.
      UV_THREADPOOL_SIZE: "64"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - api-avatars:${AVATAR_UPLOAD_DIR}
      - ./plugins:/workspace/plugins:ro
    networks:
      - __SLUG__-network

  # One-off: applies this project's own private Postgres seeds
  # (migrations/*.sql) after nexus-edge's own migrations (run by the api
  # service's startup command) have created the devices/nodes tables.
  # Deliberately plain psql, not a second node-pg-migrate instance -
  # fine for a handful of seed files, not an evolving migration history;
  # reconsider if that changes. Empty migrations/ at generation time is
  # fine - loops over zero files.
  migrate-extra:
    image: postgres:16-alpine
    container_name: __SLUG__-migrate-extra
    depends_on:
      - postgres
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for i in $$(seq 1 30); do
          if psql -c "select 1 from devices limit 1" >/dev/null 2>&1; then
            echo "devices table ready, applying private seeds"
            for f in /migrations/*.sql; do
              [ -e "$$f" ] || continue
              echo "applying $$f"
              psql -v ON_ERROR_STOP=1 -f "$$f"
            done
            exit 0
          fi
          echo "waiting for nexus-edge's own migrations to create devices table ($$i/30)"
          sleep 2
        done
        echo "timed out waiting for devices table" >&2
        exit 1
    networks:
      - __SLUG__-network

  messaging-gateway:
    build:
      context: ${NEXUS_EDGE_SOURCE_PATH}
      dockerfile: apps/messaging-gateway/Dockerfile
    container_name: __SLUG__-messaging-gateway
    restart: unless-stopped
    env_file: .env
    depends_on:
      - redis
      - rabbitmq
    networks:
      - __SLUG__-network

  # Own Dockerfile + build context (extension points design, nexus-edge
  # AGENTS_TO_DO.md 2026-07-28/29) - see apps/ui/Dockerfile's header comment
  # for why this one service can't reuse nexus-edge's Dockerfile
  # unmodified the way api/orchestrator/device-service do.
  # additional_contexts (not a shared parent context) is what lets
  # NEXUS_EDGE_SOURCE_PATH be an arbitrary path, not just a sibling
  # directory.
  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      additional_contexts:
        nexus-edge: ${NEXUS_EDGE_SOURCE_PATH}
      args:
        VITE_PROJECT_NAME: ${PROJECT_NAME}
    container_name: __SLUG__-ui
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
      - messaging-gateway
    ports:
      - "${UI_PORT}:80"
    networks:
      - __SLUG__-network

networks:
  __SLUG__-network: {}

volumes:
  postgres-data:
  api-avatars:
