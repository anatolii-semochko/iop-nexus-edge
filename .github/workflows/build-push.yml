name: Build and push images

# Cloud build -> deploy on Pi (AGENTS_TO_DO.md, 2026-08-27). Builds the
# four services that are project-agnostic (no target-project plugins
# baked in at build time - api/orchestrator/device-service/
# messaging-gateway all load plugins/extra-res at *runtime* via bind
# mounts and env vars, see docker-compose.yml in any target project).
# The `ui` image is NOT built here - it bakes a target project's own
# private plugins/ into the Vite bundle at build time, so it has its
# own workflow in that target project's own repo (e.g.
# nexus-edge-aquarium/.github/workflows/build-push.yml).
#
# arm64-only, cross-built via QEMU on the standard free ubuntu-latest
# runner - the only real consumer of these images today is a Raspberry
# Pi 4 (aarch64), and QEMU cross-compilation stays free regardless of
# repo visibility (native arm64 GitHub-hosted runners are a paid tier
# for private repos).
#
# Tag = branch name (slashes replaced with '-', since a raw branch name
# like "feature/development-2" is not usable as a single Docker tag
# component) plus a second, immutable "<branch>-<sha>" tag for exact
# rollback. No "latest" tag - the Pi's own deploy step picks an
# explicit tag, see docker-compose.deploy.yml in nexus-edge-aquarium.

on:
  push:
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/nexus-edge

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: orchestrator
            dockerfile: apps/orchestrator/Dockerfile
          - service: device-service
            dockerfile: apps/device-service/Dockerfile
          - service: messaging-gateway
            dockerfile: apps/messaging-gateway/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Compute branch-based image tag
        id: tag
        run: echo "tag=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.tag.outputs.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
